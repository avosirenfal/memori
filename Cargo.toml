[package]
name = "memori"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explains where your RAM is going, in plain language"
readme = "README.md"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.6", features = ["fs", "param"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
